<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modern clock ⏰</title>
    <link rel="stylesheet" href="style.css">
   
</head>

<body>
    <div class="clock" >
        <svg class="bezel" viewBox="0 0 660 660">
            <circle cx="330" cy="330" r="320"/>
        </svg>
        <div class="dial">
            <div class="markers"></div>
            <i class="hand hour"></i>
            <i class="hand minute"></i>
            <i class="hand second"></i>
            <span class="pin"></span>
        </div>
    </div>
  
     



</body>

</html>
