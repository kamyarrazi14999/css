<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modern clock ⏰</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href=" https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="clock">
        <svg class="bezel" viewBox="0 0 600 600">
            <circle cx="300" cy="300" r="320"/>
        </svg>
        <div class="markers">
            <i class="hand houre"></i>
            <i class="hand minute"></i>
            <i class="hand second"></i>
            <div class="pin"></div>
        </div>
    </div>

</body>

</html>
